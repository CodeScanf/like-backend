spring:
  application:
    name: ${APP_NAME:like-backend}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource: # 真实值请放 application-local.yml 或用环境变量注入；URL/用户名/密码不要提交到仓库
    driver-class-name: ${LIKE_DB_DRIVER:com.mysql.cj.jdbc.Driver}
    url: ${LIKE_DB_URL:}
    username: ${LIKE_DB_USERNAME:}
    password: ${LIKE_DB_PASSWORD:}
  mvc:
    servlet:
      path: /api

knife4j:
  enable: true
  setting:
    language: zh_cn

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
